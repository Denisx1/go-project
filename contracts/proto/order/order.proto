syntax = "proto3";

package order;

option go_package = "contracts/gen/go/order/v1;orderv1";

service Order {
    rpc Register(RegisterRequest) returns (RegisterResponse);

}
message RegisterRequest {
    string title = 1;
    string text = 2;

}
message RegisterResponse{
    string id = 1;
    int64 version = 2;
    string title = 3;
    string text = 4;
    bool is_active = 5;
}
