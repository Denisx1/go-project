syntax = "proto3";

package order;
import "buf/validate/validate.proto";
option go_package = "contracts/gen/go/order/v1;orderv1";

service Order {
    rpc Create(CreateRequest) returns (RegisterResponse);
    rpc Get(GetRequest) returns (GetResponse);
    rpc Delete(DeleteRequest) returns (DeleteResponse);
    rpc Patch(PatchRequest) returns (PatchResponse);
}


message CreateRequest {
    string title = 1 [(buf.validate.field).string = {min_len: 1, max_len: 200, pattern: "\\S"}];
    string text  = 2 [(buf.validate.field).string = {min_len: 1, max_len: 5000, pattern: "\\S"}];
}

message GetRequest {
    string id = 1 [(buf.validate.field).string.uuid = true];
}

message DeleteRequest {
    string id = 1 [(buf.validate.field).string.uuid = true];
}
message GetResponse{
    string id = 1;
    int64  version  = 2;          
    string title = 3;
    string text  = 4;
    bool is_active = 5;
}
message PatchRequest{
    string id = 1;
    int64  version  = 2;          
    optional string title = 3;
    optional string text  = 4;
    optional bool is_active = 5;
}
message PatchResponse {
    string id = 1;
    int64 version = 2;
    string title = 3;
    string text = 4;
    bool is_active = 5;
}

message DeleteResponse {}

message RegisterResponse{
    string id = 1;
    int64 version = 2;
    string title = 3;
    string text = 4;
    bool is_active = 5;
}
