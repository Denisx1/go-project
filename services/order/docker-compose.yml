services:
  port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: ${PORT_FORWARDER_CONTAINER}
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:${POSTGRES_CONTAINER}:${POSTGRES_PORT}
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - shared-network
  order-migrate:
    image: migrate/migrate:v4.19.1
    container_name: ${MIGRATION_CONTAINER}
    volumes:
      - ${MIGRATION_FOLDER}:/migrations
    networks:
      - shared-network
  postgres:
    image: postgres:18-alpine
    container_name: ${POSTGRES_CONTAINER}
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    command: [ 'postgres', '-c', 'wal_level=logical', '-c', 'max_replication_slots=10', '-c', 'max_wal_senders=10' ]
    volumes:
      - ${POSTGRES_FOLDER}:/var/lib/postgresql
    restart: always
    networks:
      - shared-network
networks:
  shared-network:
    external: true
